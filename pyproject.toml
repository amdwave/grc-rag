[project]
name = "grc-rag"
version = "0.1.0"
description = "RAG over regulatory primary sources (EU AI Act first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.37.1",
    "sentence-transformers>=5.7.0",
    "openai>=2.6.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
